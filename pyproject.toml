[project]
name = "cpguard"
version = "0.0.1"
description = "CPG-based taint analysis SAST with LLM triage"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "pyyaml",
    "django>=5.0",
]

[project.scripts]
cpguard = "cpguard.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cpguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
cpguard = ["specs/*.yml", "web/templates/*.html"]
