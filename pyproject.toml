[project]
name = "cpguard"
version = "0.0.1"
description = "CPG-based taint analysis SAST with LLM triage"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-php",
    "pyyaml",
    "django>=5.0",
]

[project.scripts]
cpguard = "cpguard.cli:main"

[project.gui-scripts]
cpguard-app = "cpguard.desktop:main"

[project.optional-dependencies]
dev = ["pytest"]
triage = ["anthropic>=0.40"]
desktop = ["pywebview>=5.0"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
all-llm = ["anthropic>=0.40", "openai>=1.40", "google-genai>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cpguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
cpguard = ["specs/*.yml", "web/templates/*.html", "web/migrations/*.py"]
