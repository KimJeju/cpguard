# 하드코딩된 비밀정보 — 언어 무관, 모든 텍스트 파일(.env·.properties·.yml·.sql 포함).
# 유출 사고의 가장 흔한 단일 원인. 탐지값은 마스킹해서 산출물 자체가 유출원이 되지 않게 한다.
defaults:
  category: secret
  all_files: true
  mask: secret
  cwe: CWE-798
  owasp: "A07:2021-Identification and Authentication Failures"

rules:
  - id: secret.credential-assignment
    message: "비밀번호/토큰/키가 문자열로 하드코딩되어 있습니다."
    severity: high
    confidence: high
    group: 1
    # 밑줄 앞에 붙은 변수명(db_password, MY_SECRET_KEY)도 잡도록 \b 대신 lookbehind
    pattern: '(?<![A-Za-z0-9])(?:pass(?:word|wd|phrase)?|pwd|secret(?:[_-]?key)?|client[_-]?secret|api[_-]?key|apikey|app[_-]?key|access[_-]?key|auth[_-]?token|access[_-]?token|refresh[_-]?token|private[_-]?key|priv[_-]?key|credential|encrypt(?:ion)?[_-]?key|store[_-]?pass|key[_-]?pass|keystore[_-]?password|비밀번호)\b\s*[:=]\s*["'']([^"''\r\n]{4,120})["'']'
    exclude:
      - '(process\.env|os\.environ|getenv|System\.getenv|import\.meta\.env|@Value\(|ConfigurationManager)'
      - '["''][^"'']*(\*{3,}|x{4,}|changeme|your[_-]?|example|placeholder|dummy|sample|<|TODO)'
      - '\$\{|\{\{|%s|%\(|\bnull\b|\bNone\b|\bundefined\b'

  - id: secret.config-file-credential
    message: "설정 파일에 자격증명이 평문으로 들어 있습니다."
    severity: high
    confidence: medium
    group: 1
    # 설정 파일 전용. 소스 코드에 적용하면 user.password = hash_password() 같은
    # 대입문까지 잡아 오탐이 폭발한다(실전 프로젝트에서 확인). 소스는 위 규칙이 담당.
    file_exts: [".properties", ".env", ".ini", ".cfg", ".conf", ".config", ".yml", ".yaml",
                ".toml", ".json", ".xml", ".txt", ".sh", ".bat", ".ps1", ".tfvars"]
    pattern: '^\s*[\w.\-]{0,60}(?:pass(?:word|wd)?|pwd|secret|token|api[_-]?key|apikey|access[_-]?key|credential|passphrase)[\w.\-]{0,30}\s*[:=]\s*["'']?([^"''\s]{4,})'
    exclude:
      - '(process\.env|os\.environ|getenv|\$\{|\{\{|%\(|<%|\benv\b|\bENC\(|vault:)'
      - '(changeme|your[_-]?|example|placeholder|dummy|sample|\*{3,}|x{4,}|<)'
      - '\('

  - id: secret.uri-credentials
    message: "URI 안에 계정:비밀번호가 하드코딩되어 있습니다."
    severity: high
    confidence: high
    group: 1
    pattern: '\b[a-zA-Z][a-zA-Z0-9+.\-]{2,15}://([^\s:@/"''<>]{1,64}:[^\s:@/"''<>]{1,64})@[^\s"''<>]{1,120}'
    exclude:
      - '\{[A-Za-z_][A-Za-z0-9_.]*\}|\$\{|\$[A-Za-z_]|process\.env|os\.environ'
      - 'user(name)?:pass(word)?@|USER:PASS@|foo:bar@'

  - id: secret.basic-auth-header
    message: "Authorization 헤더 값이 하드코딩되어 있습니다."
    severity: high
    confidence: high
    group: 1
    pattern: 'Authorization\s*[:=]\s*["'']?\s*(?:Basic|Bearer)\s+([A-Za-z0-9+/=._\-]{10,})'
    exclude:
      - '\$\{|\{\{|process\.env|os\.environ|\btoken\b\s*\}|\+\s*token'

  - id: secret.private-key
    message: "개인키(PEM/PGP/PuTTY)가 소스에 포함되어 있습니다."
    severity: critical
    confidence: high
    mask: none
    skip_comments: false
    cwe: CWE-321
    pattern: '(-----BEGIN [A-Z0-9 ]{0,30}PRIVATE KEY-----|-----BEGIN PGP PRIVATE KEY BLOCK-----|PuTTY-User-Key-File-\d)'

  - id: secret.connection-string
    message: "인증 정보가 포함된 DB 접속 문자열이 하드코딩되어 있습니다."
    severity: high
    confidence: high
    group: 1
    pattern: '(?:mongodb(?:\+srv)?|mysql|postgres(?:ql)?|redis|amqp|mssql|oracle|ldaps?|s?ftp|jdbc:[a-z]+)://([^\s:@"'']+:[^\s:@"'']+)@'
    exclude:
      - '\{[A-Za-z_][A-Za-z0-9_.]*\}|\$\{|\$[A-Za-z_]|process\.env|os\.environ|getenv'
      - 'user(name)?:pass(word)?@|USER:PASS@'

  - id: secret.ado-connection-password
    message: "연결 문자열에 비밀번호가 평문으로 들어 있습니다."
    severity: medium
    confidence: medium
    group: 1
    pattern: '\b(?:pwd|password)\s*=\s*([^;\r\n"'']{2,60})\s*;'
    exclude:
      - '\$\{|\{\{|%\(|\$[A-Za-z_]|<'
