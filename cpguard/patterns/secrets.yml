# 하드코딩된 비밀정보 — 언어 무관. 유출 사고의 가장 흔한 단일 원인.
rules:
  - id: secret.hardcoded-password
    message: "소스에 비밀번호가 하드코딩되어 있습니다."
    severity: high
    cwe: CWE-798
    owasp: "A07:2021-Identification and Authentication Failures"
    pattern: '(password|passwd|pwd|비밀번호)\s*[:=]\s*["''][^"'']{4,}["'']'
    exclude:
      - '(process\.env|os\.environ|getenv|System\.getenv|import\.meta\.env)'
      - '["''][^"'']*(\*{3,}|x{4,}|changeme|your[_-]?|example|placeholder|dummy|sample|<|TODO)'
      - '\$\{|\{\{|%s|%\(|\bnull\b|\bNone\b'

  - id: secret.api-key
    message: "소스에 API 키/토큰이 하드코딩되어 있습니다."
    severity: high
    cwe: CWE-798
    owasp: "A07:2021-Identification and Authentication Failures"
    pattern: '(api[_-]?key|apikey|secret[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret)\s*[:=]\s*["''][A-Za-z0-9_\-\.]{16,}["'']'
    exclude:
      - '(process\.env|os\.environ|getenv|import\.meta\.env)'
      - '\$\{|\{\{|%s|your[_-]?|example|placeholder'

  - id: secret.private-key
    message: "개인키(PEM)가 소스에 포함되어 있습니다."
    severity: critical
    cwe: CWE-798
    owasp: "A02:2021-Cryptographic Failures"
    pattern: '-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'
    skip_comments: false

  - id: secret.aws-access-key
    message: "AWS 액세스 키로 보이는 값이 하드코딩되어 있습니다."
    severity: critical
    cwe: CWE-798
    owasp: "A07:2021-Identification and Authentication Failures"
    pattern: '\bAKIA[0-9A-Z]{16}\b'
    skip_comments: false

  - id: secret.connection-string
    message: "인증 정보가 포함된 접속 문자열이 하드코딩되어 있습니다."
    severity: high
    cwe: CWE-798
    owasp: "A07:2021-Identification and Authentication Failures"
    pattern: '(mongodb|mysql|postgres(ql)?|redis|amqp|jdbc:[a-z]+)://[^\s:@"'']+:[^\s:@"'']+@'
    exclude:
      # f-string/템플릿 변수로 조립한 경우는 하드코딩이 아니다: f"...{user}:{passwd}@..."
      - "\\{[A-Za-z_][A-Za-z0-9_.]*\\}"
      - '(process\.env|os\.environ|getenv|\$\{|\$[A-Za-z_])'
      - 'user(name)?:pass(word)?@|USER:PASS@'
