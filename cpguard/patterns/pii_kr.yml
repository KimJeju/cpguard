# 한국형 개인정보(PII) 노출 점검 — 소스·SQL 덤프·설정 등 모든 텍스트 파일.
# 정규식만으로는 오탐이 크므로 주민번호는 체크섬, 카드번호는 Luhn 으로 확정한다.
# 탐지값은 반드시 마스킹한다: 점검 산출물이 그 자체로 개인정보가 되면 안 된다.
# (현장 점검 스크립트 check_account.py / pill_account.py 에서 옮겨옴)
defaults:
  category: pii
  all_files: true
  cwe: CWE-359
  owasp: "A02:2021-Cryptographic Failures"
  skip_comments: false

rules:
  - id: pii.kr-resident-number
    message: "주민등록번호/외국인등록번호로 확인된 값이 소스에 있습니다 (체크섬 검증 통과)."
    severity: critical
    confidence: high
    validator: rrn
    mask: rrn
    # 앞뒤 '.' 도 경계로 본다: GPS 좌표 35.8409053123456 의 소수부가 13자리 주민번호로 잡혔다
    pattern: '(?<![\d.])\d{6}[-\s]?[1-8]\d{6}(?![\d.])'

  - id: pii.credit-card-number
    message: "신용카드번호로 확인된 값이 소스에 있습니다 (Luhn 검증 통과)."
    severity: critical
    confidence: high
    validator: luhn
    mask: card
    pattern: '(?<![\d.])(?:\d[ -]?){15,18}\d(?![\d.])'

  - id: pii.kr-mobile-number
    message: "휴대폰번호 형식의 값이 소스에 있습니다."
    severity: medium
    confidence: medium
    mask: phone
    pattern: '(?<![\d.])01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}(?![\d.])'
    exclude: ['010-?0000-?0000|010-?1234-?5678|010-?1111-?1111|example|sample|테스트']

  - id: pii.kr-landline-number
    message: "유선전화번호 형식의 값이 소스에 있습니다."
    severity: low
    confidence: low
    mask: phone
    pattern: '(?<![\d.])0(?:2|3[1-3]|4[1-4]|5[1-5]|6[1-4])[-\s]?\d{3,4}[-\s]?\d{4}(?![\d.])'

  - id: pii.email-address
    message: "이메일 주소가 소스에 있습니다."
    severity: low
    confidence: medium
    mask: email
    pattern: '\b[A-Za-z0-9._%+\-]{2,64}@[A-Za-z0-9.\-]{2,60}\.[A-Za-z]{2,12}\b'
    exclude: ['(example\.com|example\.org|test\.com|localhost|noreply|no-reply|@sentry\.io|@w3\.org|@schema)']

  - id: pii.kr-passport-number
    message: "여권번호 형식의 값이 소스에 있습니다."
    severity: medium
    confidence: low
    mask: generic
    pattern: '(?<![A-Za-z0-9])[MSRODmsrod]\d{8}(?![0-9A-Za-z])'

  - id: pii.kr-business-number
    message: "사업자등록번호 형식의 값이 소스에 있습니다 (개인정보는 아니나 참고)."
    severity: info
    confidence: low
    mask: none
    pattern: '(?<![\d.])\d{3}-\d{2}-\d{5}(?![\d.])'

  - id: pii.sensitive-column-name
    # 소스 코드의 변수명(passwd = os.getenv(...))까지 잡으면 노이즈다. DDL·덤프·설정만.
    file_exts: [".sql", ".ddl", ".csv", ".txt", ".xml", ".properties", ".yml", ".yaml"]
    message: "개인정보를 담는 것으로 보이는 컬럼/식별자입니다 — 저장·암호화 정책을 확인하세요."
    severity: info
    confidence: low
    mask: none
    pattern: '\b(?:jumin(?:no)?|rrn|ssn|resident_?no|passwd|passwrd|user_?pw|passport(?:_no)?|card_?no|cardnumber|credit_?card|cvc|cvv|account_?no|acctno|bank_account|hp_no|tel_no|phone_no|mobile_no|birthday|drv_lic|license_no|주민(?:등록)?|외국인등록|여권|카드번호|계좌번호|휴대폰|생년월일|운전면허)\b'
