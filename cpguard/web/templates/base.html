<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CPGuard{% endblock %}</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171d26; --line:#242c38; --fg:#e6edf3; --muted:#8b98a8;
    --accent:#4da3ff; --crit:#ff5c5c; --high:#ff9f43; --med:#ffd166; --low:#6fcf97;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Malgun Gothic",-apple-system,Segoe UI,sans-serif;font-size:14px;line-height:1.6}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:12px}
  .logo{font-weight:700;font-size:18px;letter-spacing:.5px}
  .logo span{color:var(--accent)}
  .tag{color:var(--muted);font-size:12px}
  main{max-width:1080px;margin:0 auto;padding:28px 24px 60px}
  header{flex:0 0 auto}
  /* 작업대처럼 화면을 꽉 채우는 페이지를 위해 body 를 세로 flex 로 둔다 */
  body.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  body.app main{max-width:none;margin:0;padding:0;flex:1;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
  h2{margin:0 0 14px;font-size:16px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700}
  .critical{background:rgba(255,92,92,.15);color:var(--crit)}
  .high{background:rgba(255,159,67,.15);color:var(--high)}
  .medium{background:rgba(255,209,102,.15);color:var(--med)}
  .low{background:rgba(111,207,151,.15);color:var(--low)}
  .info{background:rgba(139,152,168,.15);color:var(--muted)}
  .v-true_positive{background:rgba(255,92,92,.15);color:var(--crit)}
  .v-false_positive{background:rgba(111,207,151,.15);color:var(--low)}
  .v-uncertain{background:rgba(139,152,168,.18);color:var(--muted)}
  .btn{display:inline-block;background:var(--accent);color:#06121f;border:0;border-radius:7px;
       padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .muted{color:var(--muted)}
  .err{background:rgba(255,92,92,.12);border:1px solid rgba(255,92,92,.35);color:#ffb3b3;
       padding:10px 14px;border-radius:8px;margin-bottom:16px}
  code{font-family:Consolas,monospace;background:#0b1017;padding:1px 6px;border-radius:4px;font-size:12.5px}
</style>
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
<header>
  <div class="logo">CP<span>Guard</span></div>
  <div class="tag">CPG 기반 taint 분석 정적 보안 스캐너</div>
  <div style="margin-left:auto"><a href="/">스캔 목록</a></div>
</header>
{% block content_raw %}<main>{% block content %}{% endblock %}</main>{% endblock %}
</body>
</html>
