<script>try{var t=localStorage.getItem('cpguard.theme');if(t&&t!=='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
  /* ---- 테마: 모든 색은 변수로. 배지·하이라이트 틴트는 color-mix 로 accent/severity 에서 파생 ----
       테마를 추가하려면 [data-theme="x"] 블록에서 이 변수들만 재정의하면 된다. ---- */
  :root{  /* dark (기본) */
    color-scheme:dark;
    --bg:#0f1419; --panel:#171d26; --panel-2:#131922; --sunken:#0d1219;
    --line:#242c38; --line-2:#1b222c; --hover:#161d27; --sel:#1b2836; --elev:#22303f;
    --fg:#e6edf3; --muted:#8b98a8; --ln:#4a5666; --accent:#4da3ff; --on-accent:#06121f;
    --crit:#ff5c5c; --high:#ff9f43; --med:#ffd166; --low:#6fcf97;
    --t-kw:#c792ea; --t-str:#a5d6a7; --t-com:#5c6b7a; --t-num:#f78c6c; --t-fn:#82aaff;
    --overlay:rgba(4,8,13,.55); --shadow:rgba(0,0,0,.5);
    --scroll:rgba(255,255,255,.16); --scroll-hover:rgba(255,255,255,.32);
  }
  /* ---- HIG: 타입 스케일 · 간격(8pt) · 반경 · 엘리베이션 (테마 무관) ---- */
  :root{
    --fs-display:30px; --fs-title:20px; --fs-headline:15px; --fs-body:13.5px; --fs-caption:12px;
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
    --radius:14px; --radius-sm:9px;
    --elev-1:0 1px 2px var(--shadow), 0 1px 3px var(--shadow);
    --elev-2:0 4px 12px var(--shadow), 0 2px 4px var(--shadow);
    /* 리퀴드 글래스(기능 레이어): panel 에서 파생한 반투명 + 블러 */
    --glass:color-mix(in srgb, var(--panel) 74%, transparent);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#ffffff; --panel:#f3f3f3; --panel-2:#ececec; --sunken:#ffffff;
    --line:#d4d4d4; --line-2:#e6e6e6; --hover:#eaeaea; --sel:#d6e6fb; --elev:#e0e0e0;
    --fg:#1f2328; --muted:#6a737d; --ln:#b0b6bd; --accent:#0969da; --on-accent:#ffffff;
    --crit:#cf222e; --high:#bc4c00; --med:#9a6700; --low:#1a7f37;
    --t-kw:#a626a4; --t-str:#50a14f; --t-com:#a0a1a7; --t-num:#b76b01; --t-fn:#4078f2;
    --overlay:rgba(60,60,60,.35); --shadow:rgba(0,0,0,.22);
    --scroll:rgba(0,0,0,.20); --scroll-hover:rgba(0,0,0,.36);
  }
  :root[data-theme="vscode"]{
    color-scheme:dark;
    --bg:#1e1e1e; --panel:#252526; --panel-2:#2d2d2d; --sunken:#1e1e1e;
    --line:#333333; --line-2:#2a2a2a; --hover:#2a2d2e; --sel:#094771; --elev:#37373d;
    --fg:#d4d4d4; --muted:#858585; --ln:#858585; --accent:#007acc; --on-accent:#ffffff;
    --crit:#f14c4c; --high:#ff8c00; --med:#cca700; --low:#89d185;
    --t-kw:#569cd6; --t-str:#ce9178; --t-com:#6a9955; --t-num:#b5cea8; --t-fn:#dcdcaa;
    --overlay:rgba(0,0,0,.5); --shadow:rgba(0,0,0,.55);
    --scroll:rgba(121,121,121,.4); --scroll-hover:rgba(160,160,160,.65);
  }
  :root[data-theme="ghidra"]{  /* 회색 — Ghidra 계열 밝은 그레이 */
    color-scheme:light;
    --bg:#cfcfca; --panel:#dedeD8; --panel-2:#d2d2cc; --sunken:#f4f4f0;
    --line:#a8a8a2; --line-2:#c6c6c0; --hover:#c6cbd2; --sel:#b6c9e0; --elev:#c8c8c2;
    --fg:#1a1a1a; --muted:#55554e; --ln:#80807a; --accent:#2f5b9c; --on-accent:#ffffff;
    --crit:#b00020; --high:#b25f00; --med:#8a6d00; --low:#2f7d32;
    --t-kw:#0000c0; --t-str:#007000; --t-com:#808080; --t-num:#b03000; --t-fn:#204a87;
    --overlay:rgba(80,80,80,.4); --shadow:rgba(0,0,0,.3);
    --scroll:rgba(0,0,0,.28); --scroll-hover:rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  /* HIG 접근성: 키보드 포커스 인디케이터 (마우스 클릭엔 안 뜨고 키보드 탐색에만) */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* ---- 스크롤바: VSCode 식 얇은 오버레이 (테마 변수로 색) ---- */
  *{scrollbar-width:thin; scrollbar-color:var(--scroll) transparent}
  ::-webkit-scrollbar{width:14px;height:14px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border:4px solid transparent;background-clip:padding-box;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover);border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-corner{background:transparent}

  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",Roboto,sans-serif;
       font-size:var(--fs-body);line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  /* ---- 헤더 = 기능 레이어: 리퀴드 글래스(반투명+블러), 스크롤 시 콘텐츠가 비쳐 지나간다 ---- */
  header{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);padding:12px 24px;
         display:flex;align-items:center;gap:12px;flex:0 0 auto;
         background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5)}
  .logo{font-weight:700;font-size:17px;letter-spacing:.2px}
  .logo span{color:var(--accent)}
  .tag{color:var(--muted);font-size:var(--fs-caption)}
  main{max-width:1120px;margin:0 auto;padding:var(--sp-6) var(--sp-5) 60px}
  /* 작업대처럼 화면을 꽉 채우는 페이지를 위해 body 를 세로 flex 로 둔다 */
  body.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  body.app main{max-width:none;margin:0;padding:0;flex:1;min-height:0}
  /* ---- 카드 = 콘텐츠 레이어: 표준 머티리얼(엘리베이션·헤어라인), 글래스 아님 ---- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:var(--sp-5);margin-bottom:var(--sp-4);box-shadow:var(--elev-1)}
  h1{font-size:var(--fs-title);font-weight:650;letter-spacing:-.01em;margin:0 0 var(--sp-3)}
  h2{margin:0 0 var(--sp-3);font-size:var(--fs-headline);font-weight:600;letter-spacing:-.005em}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700}
  .critical{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
  .high{background:color-mix(in srgb,var(--high) 15%,transparent);color:var(--high)}
  .medium{background:color-mix(in srgb,var(--med) 15%,transparent);color:var(--med)}
  .low{background:color-mix(in srgb,var(--low) 15%,transparent);color:var(--low)}
  .info{background:color-mix(in srgb,var(--muted) 15%,transparent);color:var(--muted)}
  .v-true_positive{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
  .v-false_positive{background:color-mix(in srgb,var(--low) 15%,transparent);color:var(--low)}
  .v-uncertain{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
  .btn{display:inline-block;background:var(--accent);color:var(--on-accent);border:0;border-radius:7px;
       padding:9px 16px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .muted{color:var(--muted)}
  .err{background:color-mix(in srgb,var(--crit) 12%,transparent);border:1px solid color-mix(in srgb,var(--crit) 35%,transparent);
       color:color-mix(in srgb,var(--crit) 65%,var(--fg));padding:10px 14px;border-radius:8px;margin-bottom:16px}
  code{font-family:Consolas,monospace;background:var(--sunken);border:1px solid var(--line-2);padding:1px 6px;border-radius:4px;font-size:12.5px}
  /* ---- 테마 셀렉터 ---- */
  #theme-sel{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;
             padding:4px 8px;font-size:12px;font-family:inherit;cursor:pointer}
  /* ---- 커스텀 상단바 (프레임리스 데스크톱 창) ---- */
  header{-webkit-user-select:none;user-select:none}
  .drag-spacer{flex:1;align-self:stretch;min-width:20px}
  #winctl{display:flex;gap:2px;margin-left:6px}
  .winbtn{width:40px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;
          border:0;color:var(--muted);cursor:pointer;font-size:13px;border-radius:5px;line-height:1;-webkit-app-region:no-drag}
  .winbtn:hover{background:var(--hover);color:var(--fg)}
  .winbtn.winclose:hover{background:#e81123;color:#fff}
  /* ---- 앱 툴바 (Ghidra 식 아이콘 툴 스트립) ---- */
  .apptools{display:flex;align-items:center;gap:2px}
  .tbtn{width:32px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;
        color:var(--muted);font-size:15px;text-decoration:none;cursor:pointer;border:1px solid transparent;-webkit-app-region:no-drag}
  .tbtn:hover{background:var(--hover);color:var(--fg);border-color:var(--line);text-decoration:none}
  .tsep{width:1px;height:20px;background:var(--line);margin:0 8px}
  .tbtn:disabled,.tbtn[aria-disabled=true]{opacity:.35;cursor:default;pointer-events:none}
  /* ---- 드롭다운 앱 메뉴 ---- */
  .menu{position:relative}
  .menu-btn{font-size:17px}
  /* 커스텀 콤보박스 — 네이티브 datalist 팝업(테마 무시·세리프) 대체 */
  .cb-menu{position:absolute;z-index:80;max-height:260px;overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm,9px);
    box-shadow:var(--elev-2,0 8px 24px rgba(0,0,0,.4));padding:5px;
    scrollbar-width:thin;scrollbar-color:var(--ln) transparent}
  .cb-menu::-webkit-scrollbar{width:10px}
  .cb-menu::-webkit-scrollbar-thumb{background:var(--ln);border:3px solid var(--panel);border-radius:6px}
  .cb-opt{padding:7px 11px;border-radius:6px;font:12px/1.4 Consolas,'Cascadia Code',monospace;
    color:var(--fg);cursor:pointer;white-space:nowrap}
  .cb-opt:hover,.cb-opt.active{background:color-mix(in srgb,var(--accent) 22%,transparent)}
  .cb-empty{padding:7px 11px;color:var(--muted);font-size:12px}
  /* 커스텀 셀렉트 트리거 — 네이티브 select 팝업(테마 무시) 대체 */
  .cb-select{display:inline-flex;align-items:center;gap:10px;justify-content:space-between;
    background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;
    padding:5px 10px;font-size:12px;cursor:pointer;user-select:none;vertical-align:middle}
  .cb-select[data-mono]{font-family:Consolas,'Cascadia Code',monospace}
  .cb-select .cb-ph{color:var(--muted)}
  .cb-select .cb-chev{margin-left:auto;opacity:.55;font-size:10px;transition:transform .12s}
  .cb-select.open{border-color:var(--accent)}
  .cb-select.open .cb-chev{transform:rotate(180deg)}
  .cb-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cb-opt.sel{color:var(--accent)}
  .menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:70;min-width:210px;
            background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);
            border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--elev-2);padding:5px;-webkit-app-region:no-drag}
  .mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border-radius:6px;font-size:13px;
      color:var(--fg);text-decoration:none;background:transparent;border:0;cursor:pointer;text-align:left;font-family:inherit;white-space:nowrap}
  .mi:hover{background:var(--hover);text-decoration:none}
  .mi-ic{width:18px;text-align:center;font-size:13px;flex:0 0 18px}
  .mi kbd{margin-left:auto;font-family:Consolas,monospace;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
  .mi-sep{height:1px;background:var(--line);margin:5px 6px}
</style>
{% block head %}{% endblock %}
</head>

      <a class="mi" href="/settings/"><span class="mi-ic">⚙️</span>설정 · LLM</a>
      <div class="mi-sep"></div>
      <button class="mi" id="mi-back"><span class="mi-ic">◀</span>뒤로 <kbd>Alt+←</kbd></button>
      <button class="mi" id="mi-fwd"><span class="mi-ic">▶</span>앞으로 <kbd>Alt+→</kbd></button>
    </div>
  </div>
  <span class="tsep"></span>
  <select id="theme-sel" title="테마">
    <option value="dark">다크</option>
    <option value="light">라이트</option>
    <option value="vscode">VS Code</option>
    <option value="ghidra">Ghidra (회색)</option>
  </select>
  <div id="winctl" hidden>
    <button class="winbtn" id="win-min" title="최소화" aria-label="최소화">&#8211;</button>
    <button class="winbtn" id="win-max" title="최대화" aria-label="최대화">&#9633;</button>
    <button class="winbtn winclose" id="win-close" title="닫기" aria-label="닫기">&#10005;</button>
  </div>
</header>
{% block content_raw %}<main>{% block content %}{% endblock %}</main>{% endblock %}
<script>
  // 테마 선택 — 루트의 data-theme 로 팔레트 전환, 브라우저에 기억.
  (function () {
    var KEY = 'cpguard.theme';
    var root = document.documentElement, sel = document.getElementById('theme-sel');
    var saved = 'dark';
    try { saved = localStorage.getItem(KEY) || 'dark'; } catch (e) {}
    apply(saved);
    if (sel) { sel.value = saved; sel.addEventListener('change', function () { apply(sel.value); try { localStorage.setItem(KEY, sel.value); } catch (e) {} }); }
    function apply(t) { if (t === 'dark') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t); }
  })();

  // 프레임리스 데스크톱 창(pywebview)일 때만 창 제어 버튼 표시.
  // 브라우저(serve/폴백)면 브라우저 크롬을 쓰므로 숨긴 채 둔다.
  (function () {
    function initWinCtl() {
      if (!window.pywebview || !window.pywebview.api) return;
      var c = document.getElementById('winctl'); if (!c) return; c.hidden = false;
      var api = window.pywebview.api;
      var min = document.getElementById('win-min'),
          max = document.getElementById('win-max'),
          cls = document.getElementById('win-close');
      if (min) min.onclick = function () { api.minimize(); };
      if (max) max.onclick = function () { api.toggle_maximize(); };
      if (cls) cls.onclick = function () { api.close(); };
      // 드래그 영역 더블클릭 → 최대화 토글 (표준 제목표시줄 동작)
      document.querySelectorAll('.pywebview-drag-region').forEach(function (el) {
        el.addEventListener('dblclick', function () { api.toggle_maximize(); });
      });
    }
    if (window.pywebview) initWinCtl();
    window.addEventListener('pywebviewready', initWinCtl);
  })();

  // 드롭다운 앱 메뉴 + 뒤로/앞으로(Alt+←/→)
  (function () {
    var btn = document.getElementById('menu-btn'), pop = document.getElementById('menu-pop');
    function close() { if (pop) { pop.hidden = true; if (btn) btn.setAttribute('aria-expanded', 'false'); } }
    if (btn && pop) {
      btn.onclick = function (e) { e.stopPropagation(); pop.hidden = !pop.hidden; btn.setAttribute('aria-expanded', String(!pop.hidden)); };
      pop.addEventListener('click', function (e) { e.stopPropagation(); });
      document.addEventListener('click', close);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    }
    var back = document.getElementById('mi-back'), fwd = document.getElementById('mi-fwd');
    if (back) back.onclick = function () { close(); history.back(); };
    if (fwd) fwd.onclick = function () { close(); history.forward(); };
    document.addEventListener('keydown', function (e) {
      if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); history.back(); }
      else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); history.forward(); }
    });
  })();

  // 네이티브 datalist 팝업을 테마 커스텀 드롭다운으로 교체 (자유입력 유지)
  (function () {
    function enhance(input) {
      var dl = document.getElementById(input.getAttribute('list'));
      if (!dl) return;
      var opts = [].map.call(dl.querySelectorAll('option'), function (o) { return o.value; });
      input.removeAttribute('list');            // 네이티브 팝업 끔
      input.setAttribute('autocomplete', 'off');
      var menu = document.createElement('div');
      menu.className = 'cb-menu'; menu.hidden = true;
      document.body.appendChild(menu);
      var active = -1;
      function place() {
        var r = input.getBoundingClientRect();
        menu.style.left = (r.left + window.scrollX) + 'px';
        menu.style.top = (r.bottom + window.scrollY + 4) + 'px';
        menu.style.minWidth = r.width + 'px';
      }
      function render() {
        var q = input.value.trim().toLowerCase();
        var list = opts.filter(function (v) { return v.toLowerCase().indexOf(q) >= 0; });
        menu.innerHTML = '';
        if (!list.length) { menu.innerHTML = '<div class="cb-empty">직접 입력 가능</div>'; active = -1; return; }
        list.forEach(function (v) {
          var d = document.createElement('div');
          d.className = 'cb-opt'; d.textContent = v;
          d.addEventListener('mousedown', function (e) {
            e.preventDefault(); input.value = v; close();
            input.dispatchEvent(new Event('change', { bubbles: true }));
          });
          menu.appendChild(d);
        });
        active = -1;
      }
      function open() { place(); render(); menu.hidden = false; }
      function close() { menu.hidden = true; }
      input.addEventListener('focus', open);
      input.addEventListener('click', open);
      input.addEventListener('input', function () { menu.hidden ? open() : render(); });
      input.addEventListener('keydown', function (e) {
        if (menu.hidden) return;
        var items = menu.querySelectorAll('.cb-opt');
        if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, items.length - 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); }
        else if (e.key === 'Enter' && active >= 0 && items[active]) { e.preventDefault(); input.value = items[active].textContent; close(); return; }
        else if (e.key === 'Escape') { close(); return; }
        else return;
        [].forEach.call(items, function (it, i) { it.classList.toggle('active', i === active); if (i === active) it.scrollIntoView({ block: 'nearest' }); });
      });
      input.addEventListener('blur', function () { setTimeout(close, 130); });
      window.addEventListener('resize', function () { if (!menu.hidden) place(); });
      window.addEventListener('scroll', function () { if (!menu.hidden) place(); }, true);
    }
    document.querySelectorAll('input[list]').forEach(enhance);
  })();

  // 네이티브 select 를 테마 커스텀 드롭다운으로 교체 (select[data-custom])
  (function () {
    function enhanceSelect(sel) {
      sel.style.display = 'none';
      var trigger = document.createElement('div');
      trigger.className = 'cb-select'; trigger.tabIndex = 0; trigger.setAttribute('role', 'button');
      if (sel.hasAttribute('data-mono')) trigger.setAttribute('data-mono', '');
      if (sel.style.minWidth) trigger.style.minWidth = sel.style.minWidth;
      var label = document.createElement('span');
      var chev = document.createElement('span'); chev.className = 'cb-chev'; chev.textContent = '▾';
      trigger.appendChild(label); trigger.appendChild(chev);
      sel.parentNode.insertBefore(trigger, sel.nextSibling);
      var menu = document.createElement('div'); menu.className = 'cb-menu'; menu.hidden = true;
      document.body.appendChild(menu);
      function syncLabel() {
        var o = sel.options[sel.selectedIndex];
        label.className = (o && o.value === '') ? 'cb-ph' : '';
        label.textContent = o ? o.text : '';
      }
      function build() {
        menu.innerHTML = '';
        [].forEach.call(sel.options, function (o) {
          var d = document.createElement('div');
          d.className = 'cb-opt' + (o.selected ? ' sel' : '');
          d.textContent = o.text;
          d.addEventListener('mousedown', function (e) {
            e.preventDefault(); sel.value = o.value; syncLabel(); close();
            sel.dispatchEvent(new Event('change', { bubbles: true }));
          });
          menu.appendChild(d);
        });
      }
      function place() {
        var r = trigger.getBoundingClientRect();
        menu.style.left = (r.left + window.scrollX) + 'px';
        menu.style.top = (r.bottom + window.scrollY + 4) + 'px';
        menu.style.minWidth = r.width + 'px';
      }
      function open() { build(); place(); menu.hidden = false; trigger.classList.add('open'); }
      function close() { menu.hidden = true; trigger.classList.remove('open'); }
      trigger.addEventListener('click', function () { menu.hidden ? open() : close(); });
      trigger.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); menu.hidden ? open() : close(); }
        else if (e.key === 'Escape') close();
      });
      document.addEventListener('mousedown', function (e) {
        if (!menu.hidden && !menu.contains(e.target) && !trigger.contains(e.target)) close();
      });
      window.addEventListener('resize', function () { if (!menu.hidden) place(); });
      window.addEventListener('scroll', function () { if (!menu.hidden) place(); }, true);
      syncLabel();
    }
    document.querySelectorAll('select[data-custom]').forEach(enhanceSelect);
  })();
</script>
</body>
</html>
