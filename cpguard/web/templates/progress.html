{% extends "base.html" %}
{% block title %}스캔 진행 — {{ name }}{% endblock %}

{% block head %}
<style>
  .scan-wrap { max-width: 640px; margin: 6vh auto 0; }
  .scan-wrap h1 { font-size: 20px; margin: 0 0 4px; }
  .scan-name { color: var(--muted); font-family: Consolas, monospace; font-size: 13px; margin-bottom: 22px; word-break: break-all; }
  .bar { height: 14px; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); border-radius: 8px 0 0 8px; transition: width .25s ease; }
  /* 진행률 미상(요약 계산 등) — 흐르는 줄무늬 */
  .fill.indet { width: 35% !important; border-radius: 8px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: slide 1.1s linear infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .pct { text-align: right; font-size: 12px; color: var(--muted); margin: 6px 2px 0; height: 16px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 24px; margin-top: 22px; }
  .grid .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  .grid .v { font-size: 17px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .actions { margin-top: 26px; }
</style>
{% endblock %}

{% block content %}
<div class="scan-wrap">
  <h1>스캔 진행 중</h1>
  <div class="scan-name">{{ name }}</div>

  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="pct" id="pct"></div>

  <div class="grid">
    <div><div class="k">현재 단계</div><div class="v" id="phase">준비</div></div>
    <div><div class="k">처리</div><div class="v" id="files">—</div></div>
    <div><div class="k">탐지</div><div class="v" id="findings">0</div></div>
    <div><div class="k">경과</div><div class="v" id="elapsed">00:00</div></div>
    <div><div class="k">예상 잔여</div><div class="v" id="remain">—</div></div>
  </div>

  <div class="err" id="err" hidden style="margin-top:20px"></div>
  <div class="actions"><a class="btn ghost" href="/">목록으로 (스캔은 백그라운드에서 계속)</a></div>
</div>

<script>
(function () {
  var JOB = "{{ job_id|escapejs }}";
  var PHASE = { '준비': '준비', parse: '소스 파싱', dataflow: '데이터 흐름 분석',
                triage: 'LLM 트리아지', pattern: '패턴 검사', done: '완료' };
  var el = function (id) { return document.getElementById(id); };
  function fmt(s) { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

  var timer = setInterval(poll, 400);
  poll();

  function poll() {
    fetch('/scan/progress/' + JOB + '/status').then(function (r) { return r.json(); }).then(function (d) {
      if (d.status === 'unknown') { clearInterval(timer); el('phase').textContent = '만료된 작업'; return; }
      if (d.status === 'error') {
        clearInterval(timer);
        el('phase').textContent = '오류';
        el('err').hidden = false; el('err').textContent = '스캔 실패 — ' + (d.error || '');
        el('fill').classList.remove('indet'); return;
      }
      el('phase').textContent = PHASE[d.phase] || d.phase || '…';
      el('findings').textContent = d.findings;
      el('elapsed').textContent = fmt(d.elapsed);
      var fill = el('fill');
      if (d.total > 0) {
        var p = Math.min(100, Math.round(d.done / d.total * 100));
        fill.classList.remove('indet'); fill.style.width = p + '%'; el('pct').textContent = p + '%';
        el('files').textContent = d.done + ' / ' + d.total + ' 파일';
        el('remain').textContent = (d.done > 0 && d.done < d.total && d.elapsed > 0)
          ? fmt(d.elapsed / d.done * (d.total - d.done)) : '—';
      } else {
        fill.classList.add('indet'); el('pct').textContent = ''; el('files').textContent = '…'; el('remain').textContent = '—';
      }
      if (d.status === 'done' && d.pk) {
        clearInterval(timer);
        el('phase').textContent = '완료'; fill.classList.remove('indet');
        fill.style.width = '100%'; el('pct').textContent = '100%';
        location.href = '/scan/' + d.pk + '/';
      }
    }).catch(function () {});
  }
})();
</script>
{% endblock %}
