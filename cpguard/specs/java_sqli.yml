id: java.sqli
message: 사용자 입력이 SQL 질의문으로 흘러 들어갑니다 (SQL 주입).
severity: critical
cwe: CWE-89
owasp: A03:2021-Injection
languages:
- java
sources:
- pattern: member
  object: request
  property: &id001
  - getParameter
  - getParameterValues
  - getParameterNames
  - getParameterMap
  - getHeader
  - getHeaders
  - getQueryString
  - getCookies
  - getInputStream
  - getReader
  - getRequestURI
  - getPathInfo
  - getRequestURL
- pattern: member
  object: req
  property: *id001
- pattern: member
  object: httpRequest
  property: *id001
- pattern: member
  object: servletRequest
  property: *id001
- pattern: name
  name:
  - System.getenv
- pattern: annotation
  name:
  - RequestParam
  - PathVariable
  - RequestBody
  - RequestHeader
  - RequestPart
  - CookieValue
  - ModelAttribute
  - RequestAttribute
  - MatrixVariable
sinks:
- pattern: call
  # 질의문은 언제나 첫 인자다. executeUpdate(sql, new int[]{1,2}) 나
  # queryForObject(sql, Integer.class, bar) 처럼 뒤 인자로 넘기는 값은
  # 바인딩 파라미터·메타데이터라 질의문에 섞이지 않는다.
  arg: 0
  callee:
  - executeQuery
  - executeUpdate
  - execute
  - prepareStatement
  - prepareCall
  - executeLargeUpdate
  - executeBatch
  - createQuery
  - createNativeQuery
  - createSQLQuery
  - addBatch
  - queryForList
  - queryForObject
  # Spring JdbcTemplate 의 나머지 조회·갱신 진입점. 첫 인자가 SQL 문자열이라
  # queryForList/queryForObject 와 성질이 같다. 이름만으로 구분되는 것만 넣는다
  # (bare 'query' 는 흔한 메서드 이름이라 넣지 않는다).
  - queryForRowSet
  - queryForMap
  - queryForStream
  - queryForInt
  - queryForLong
  - batchUpdate
  - update
sanitizers:
- callee:
  - escapeHtml4
  - escapeHtml
  - encodeForHTML
  - encodeForSQL
  - htmlEscape
  - Integer.parseInt
  - parseInt
  - parseLong
  - Long.parseLong
  - matches
  - isNumeric
  - normalize
  - getCanonicalPath
  - URLEncoder.encode
validators:
  # 허용 목록·형식 검사로 거부하고 돌아가면 이어지는 코드에서는 검증된 값이다.
  # (실측: BenchProctor 안전 변형 오탐의 상당수가 이 형태였다)
  - {token: 'contains'}
  - {token: 'matches'}
  - {token: 'startsWith'}
  - {token: 'endsWith'}
  - {token: 'equals'}
