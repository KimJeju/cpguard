  # (실측: BenchProctor 안전 변형 오탐의 상당수가 이 형태였다)
  - {token: 'contains'}
  - {token: 'matches'}
  - {token: 'startsWith'}
  - {token: 'endsWith'}
  - {token: 'equals'}
