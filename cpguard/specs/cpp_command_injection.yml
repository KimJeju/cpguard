id: cpp.command-injection
message: 사용자 입력이 명령 실행 함수로 흘러 들어갑니다 (명령 주입).
severity: critical
cwe: CWE-78
owasp: A03:2021-Injection
languages:
- cpp
sources:
- pattern: name
  name:
  - argv
  - getenv
  - gets
  - fgets
  - scanf
  - fscanf
  - sscanf
  - read
  - recv
  - recvfrom
  - fread
  - getchar
  - cin
  - std::cin
  - getline
  - std::getline
  - readline
  - gets_s
  - GetCommandLine
  - GetCommandLineA
  - GetEnvironmentVariable
  - GetEnvironmentVariableA
  - ReadFile
  - recvmsg
  - WSARecv
  - getpass
  - getopt
- pattern: member
  object: argv
sinks:
- pattern: call
  callee:
  - system
  - popen
  - _popen
  - execl
  - execlp
  - execle
  - execv
  - execvp
  - execvpe
  - execve
  - ShellExecute
  - ShellExecuteA
  - ShellExecuteW
  - ShellExecuteEx
  - WinExec
  - CreateProcess
  - CreateProcessA
  - CreateProcessW
  - _spawnl
  - _spawnlp
  - _spawnv
  - _spawnvp
  - posix_spawn
  - posix_spawnp
  - std::system
  - _wsystem
sanitizers:
- callee:
  - strtol
  - strtoul
  - strtoll
  - atoi
  - atol
  - realpath
  - PathCanonicalize
  - PathCanonicalizeA
  - canonicalize_file_name
  - std::stoi
  - stoi
  - std::stol
  - stol
  - mysql_real_escape_string
  - sqlite3_mprintf
  - PQescapeString
  - PQescapeLiteral
  - std::filesystem::canonical
  - canonical
  - basename
  - std::regex_match
  - regex_match
