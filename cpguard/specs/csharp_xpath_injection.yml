- pattern: name
  name:
  - Environment.GetCommandLineArgs
  - Environment.GetEnvironmentVariable
  - Console.ReadLine
  - Console.In.ReadLine
  - HttpContext.Current.Request
  # 콘솔 앱 진입점의 명령행 인자 Main(string[] args). args[i] 는 경로가 'args.i' 라
  # startswith('args.') 로 잡힌다. 외부 입력이므로 소스로 본다.
  - args
- pattern: annotation
  name:
  - FromQuery
  - FromBody
  - FromRoute
  - FromForm
  - FromHeader
- pattern: member
  object: process
  property:
  - StandardOutput
  - StandardError
sinks:
- pattern: call
  callee:
  - SelectNodes
  - SelectSingleNode
  - XPathExpression.Compile
  - XPathNavigator.Select
  - XPathNavigator.Evaluate
  - XPathNavigator.SelectSingleNode
  - XPathNavigator.Compile
  - XmlNode.SelectNodes
  - XmlNode.SelectSingleNode
  - XmlDocument.SelectNodes
  - XmlDocument.SelectSingleNode
  - XPathSelectElements
  - XPathSelectElement
  - XPathEvaluate
  - XElement.XPathEvaluate
  - XPath.Compile
  - XPathNavigator.Matches
sanitizers:
- callee:
  - Replace
  requires:
  - "&apos;"
  - "&quot;"
  # StringBuilder/string 의 손수 XML 인코딩(`.Replace("'", "&apos;")` 체인). XPath 주입은
  # 따옴표 탈출이 핵심이라 그 엔티티 토큰이 있을 때만 정제로 본다. 수신자를 제자리에서
  # 바꾸는 문 단위 호출도 엔진이 수신자를 씻는다(_apply_mutations).
- callee:
  - HtmlEncode
  - HttpUtility.HtmlEncode
  - HttpUtility.UrlEncode
  - UrlEncode
  - AntiXss
  - AntiXssEncoder
  - Encoder.HtmlEncode
  - HtmlEncoder.Default.Encode
  - JavaScriptEncoder.Default.Encode
  - int.Parse
  - Int32.Parse
  - long.Parse
  - Int64.Parse
  - TryParse
  - int.TryParse
  - Regex.IsMatch
  - IsMatch
  - SqlParameter
  - AddWithValue
  - Parameters.Add
  - Path.GetFileName
  - GetFileName
  - Path.GetFullPath
  - GetFullPath
  - Uri.EscapeDataString
  - EscapeDataString
  - Sanitize
  - WebUtility.HtmlEncode
  - WebUtility.UrlEncode
  - SecurityElement.Escape
  - Html.Encode
validators:
- token: Contains
- token: IsMatch
- token: StartsWith
- token: EndsWith
- token: TryParse
- token: Equals
