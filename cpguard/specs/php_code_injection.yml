id: php.code-injection
message: 사용자 입력이 코드 실행 함수로 흘러 들어갑니다 (코드 주입).
severity: critical
cwe: CWE-94
owasp: A03:2021-Injection
languages:
- php
sources:
- pattern: name
  name:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - $_FILES
  - $_SERVER
  - $_SESSION
  - $_ENV
- pattern: name
  name:
  - shell_exec
  - exec
  - system
  - passthru
  - popen
  - proc_open
  - fgets
  - fread
  - file_get_contents
  - fgetss
  - stream_get_contents
  - readline
  - getenv
- pattern: outparam
  arg: 1
  name:
  - exec
sinks:
- pattern: call
  callee:
  - eval
  - assert
  - create_function
  - call_user_func
  - call_user_func_array
  - unserialize
sanitizers:
- callee:
  - intval
  - floatval
  - settype
  - is_numeric
  - number_format
  - in_array
  - array_search
  - array_key_exists
  - preg_match
  - ctype_digit
  - ctype_alpha
  - ctype_alnum
  - htmlspecialchars
  - htmlentities
  - preg_replace
- callee:
  - filter_var
  requires:
  - FILTER_VALIDATE_INT
  - FILTER_VALIDATE_FLOAT
  - FILTER_VALIDATE_BOOLEAN
  - FILTER_SANITIZE_NUMBER_INT
  - FILTER_SANITIZE_NUMBER_FLOAT
validators:
- token: in_array
- token: preg_match
- token: strcmp
- token: array_key_exists
