  - getenv
  - gets
  - fgets
  - scanf
  - fscanf
  - sscanf
  - read
  - recv
  - recvfrom
  - fread
  - getchar
  - cin
  - std::cin
  - getline
  - std::getline
  - readline
  - gets_s
  - GetCommandLine
  - GetCommandLineA
  - GetEnvironmentVariable
  - GetEnvironmentVariableA
  - ReadFile
  - recvmsg
  - WSARecv
  - getpass
  - getopt
- pattern: member
