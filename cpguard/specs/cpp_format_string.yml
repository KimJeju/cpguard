id: cpp.format-string
message: 사용자 입력이 포맷 문자열 인자로 흘러 들어갑니다 (포맷 스트링).
severity: high
cwe: CWE-134
owasp: A03:2021-Injection
languages:
- cpp
sources:
- pattern: name
  name:
