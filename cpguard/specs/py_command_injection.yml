id: py.command-injection
message: "사용자 입력이 시스템 명령 실행으로 흘러 들어갑니다 (명령 주입)."
severity: critical
cwe: CWE-78
owasp: "A03:2021-Injection"
languages: [python]
sources:
  - {pattern: name, name: ["request.GET", "request.POST", "request.args", "request.form", "request.json", "request.data", "request.values", "request.cookies", "request.headers", "sys.argv", "os.environ"]}
sinks:
  - {pattern: call, callee: [os.system, os.popen, subprocess.call, subprocess.run, subprocess.Popen, subprocess.check_output, commands.getoutput]}
sanitizers:
  - {callee: [shlex.quote, quote, int]}
