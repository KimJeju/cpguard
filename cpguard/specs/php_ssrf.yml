id: php.ssrf
message: "사용자 입력이 외부 요청 대상으로 흘러 들어갑니다 (SSRF)."
severity: high
cwe: CWE-918
owasp: "A10:2021-Server-Side Request Forgery"
languages: [php]
sources:
  - {pattern: name, name: ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_FILES", "$_SERVER", "$_SESSION", "$_ENV"]}
  # 프로세스 밖에서 들어온 값. 명령 출력과 파일 내용은 이 프로그램이 만든 값이 아니다.
  - {pattern: name, name: [shell_exec, exec, system, passthru, popen, proc_open,
                           fgets, fread, file_get_contents, fgetss, stream_get_contents,
                           readline, getenv]}
sinks:
  - {pattern: call, callee: [curl_setopt, curl_exec, fsockopen, file_get_contents, fopen]}
sanitizers:
  - {callee: [filter_var, in_array, parse_url]}
  # 숫자 변환 · 인코딩
  - {callee: [intval, settype, urlencode]}
