id: php.ssrf
message: 사용자 입력이 외부 요청 대상으로 흘러 들어갑니다 (SSRF).
severity: high
cwe: CWE-918
owasp: A10:2021-Server-Side Request Forgery
languages:
- php
sources:
- pattern: name
  name:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - $_FILES
  - $_SERVER
  - $_SESSION
  - $_ENV
- pattern: name
  name:
  - shell_exec
  - exec
  - system
  - passthru
  - popen
  - proc_open
  - fgets
  - fread
  - file_get_contents
  - fgetss
  - stream_get_contents
  - readline
  - getenv
- pattern: outparam
  arg: 1
  name:
  - exec
sinks:
- pattern: call
  callee:
  - curl_setopt
  - curl_exec
  - fsockopen
  - file_get_contents
  - fopen
sanitizers:
- callee:
  - in_array
  - parse_url
  - intval
  - settype
  - urlencode
  - array_search
  - array_key_exists
  - preg_match
  - ctype_digit
- callee:
  - filter_var
  requires:
  - FILTER_VALIDATE_INT
  - FILTER_VALIDATE_FLOAT
  - FILTER_VALIDATE_BOOLEAN
  - FILTER_SANITIZE_NUMBER_INT
  - FILTER_SANITIZE_NUMBER_FLOAT
validators:
- token: in_array
- token: preg_match
- token: strcmp
- token: array_key_exists
