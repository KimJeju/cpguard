id: js.code-injection
message: 사용자 입력이 코드 실행 함수로 흘러 들어갑니다 (코드 주입).
severity: critical
cwe: CWE-94
owasp: A03:2021-Injection
languages:
- javascript
- typescript
sources:
- pattern: member
  object: req
  property:
  - query
  - body
  - params
  - headers
  - cookies
- pattern: member
  object: location
  property:
  - hash
  - search
  - href
- pattern: annotation
  name:
  - Query
  - Body
  - Param
  - Headers
  - Req
  - Request
  - Session
  - UploadedFile
  - UploadedFiles
- pattern: member
  object: ctx
  property:
  - request
  - query
  - querystring
  - params
  - headers
  - header
  - body
  - cookies
  - req
  - originalUrl
  - url
  - host
  - href
  - search
- pattern: member
  object: ctx.request
  property:
  - body
  - query
  - querystring
  - params
  - headers
  - header
  - files
  - url
  - originalUrl
  - host
  - href
  - search
  - rawBody
- pattern: member
  object: request
  property:
  - query
  - body
  - params
  - headers
  - payload
  - cookies
  - raw
  - url
  - path
sinks:
- pattern: call
  callee:
  - eval
  - Function
  - setTimeout
  - setInterval
  - vm.runInNewContext
  arg: 0
sanitizers:
- callee:
  - parseInt
  - parseFloat
  - Number
  - Number.parseInt
  - Number.parseFloat
  - BigInt
  - Math.floor
  - Math.round
  - Math.abs
  - toFixed
- callee:
  - test
  - validator.isInt
  - validator.isNumeric
  - validator.isAlphanumeric
  - validator.isUUID
  - isNaN
  - Number.isInteger
  - Number.isFinite
validators:
  # 허용 목록·형식 검사로 거부하고 돌아가면 이어지는 코드에서는 검증된 값이다.
  # (실측: BenchProctor 안전 변형 오탐의 상당수가 이 형태였다)
  - {token: 'includes'}
  - {token: 'indexOf'}
  - {token: 'hasOwnProperty'}
  - {token: 'Object.keys'}
  - {token: 'test'}
  - {token: 'startsWith'}
  - {token: 'endsWith'}
  - {token: 'safeParse'}
  - {token: 'new Set'}
