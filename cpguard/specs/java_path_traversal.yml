id: java.path-traversal
message: 사용자 입력이 파일 경로로 흘러 들어갑니다 (경로 조작).
severity: high
cwe: CWE-22
owasp: A01:2021-Broken Access Control
languages:
- java
sources:
- pattern: member
  object: request
  property: &id001
  - getParameter
  - getParameterValues
  - getParameterNames
  - getParameterMap
  - getHeader
  - getHeaders
  - getQueryString
  - getCookies
  - getInputStream
  - getReader
  - getRequestURI
  - getPathInfo
  - getRequestURL
- pattern: member
  object: req
  property: *id001
- pattern: member
  object: httpRequest
  property: *id001
- pattern: member
  object: servletRequest
  property: *id001
- pattern: name
  name:
  - System.getenv
- pattern: annotation
  name:
  - RequestParam
  - PathVariable
  - RequestBody
  - RequestHeader
  - RequestPart
  - CookieValue
  - ModelAttribute
  - RequestAttribute
  - MatrixVariable
sinks:
- pattern: call
  callee:
  - File
  - FileInputStream
  - FileOutputStream
  - FileReader
  - FileWriter
  - Paths.get
  - Files.readAllBytes
  - Files.readAllLines
  - Files.newInputStream
  - Files.write
  - Files.delete
  - RandomAccessFile
  - getResourceAsStream
sanitizers:
- callee:
  - escapeHtml4
  - escapeHtml
  - encodeForHTML
  - encodeForSQL
  - htmlEscape
  - Integer.parseInt
  - parseInt
  - parseLong
  - Long.parseLong
  - matches
  - isNumeric
  - normalize
  - getCanonicalPath
  - URLEncoder.encode

validators:
  - {token: '..'}
  # 허용 목록·형식 검사로 거부하고 돌아가면 이어지는 코드에서는 검증된 값이다.
  # (실측: BenchProctor 안전 변형 오탐의 상당수가 이 형태였다)
  - {token: 'contains'}
  - {token: 'matches'}
  - {token: 'startsWith'}
  - {token: 'endsWith'}
  - {token: 'equals'}
