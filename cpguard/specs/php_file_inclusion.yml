id: php.file-inclusion
message: 사용자 입력이 파일 포함/경로로 흘러 들어갑니다 (LFI/RFI·경로 조작).
severity: critical
cwe: CWE-98
owasp: A01:2021-Broken Access Control
languages:
- php
sources:
- pattern: name
  name:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - $_FILES
  - $_SERVER
  - $_SESSION
  - $_ENV
- pattern: name
  name:
  - shell_exec
  - exec
  - system
  - passthru
  - popen
  - proc_open
  - fgets
  - fread
  - file_get_contents
  - fgetss
  - stream_get_contents
  - readline
  - getenv
- pattern: outparam
  arg: 1
  name:
  - exec
sinks:
- pattern: call
  callee:
  - include
  - include_once
  - require
  - require_once
  - readfile
sanitizers:
- callee:
  - basename
  - realpath
  - intval
  - in_array
  - settype
  - array_search
  - array_key_exists
  - preg_match
  - ctype_digit
  - ctype_alpha
  - ctype_alnum
  - htmlspecialchars
  - htmlentities
  - preg_replace
- callee:
  - filter_var
  requires:
  - FILTER_VALIDATE_INT
  - FILTER_VALIDATE_FLOAT
  - FILTER_VALIDATE_BOOLEAN
  - FILTER_SANITIZE_NUMBER_INT
  - FILTER_SANITIZE_NUMBER_FLOAT
validators:
- token: in_array
- token: preg_match
- token: strcmp
- token: array_key_exists
