id: php.file-inclusion
message: "사용자 입력이 파일 포함/경로로 흘러 들어갑니다 (LFI/RFI·경로 조작)."
severity: critical
cwe: CWE-98
owasp: "A01:2021-Broken Access Control"
languages: [php]
sources:
  - {pattern: name, name: ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_FILES", "$_SERVER", "$_SESSION", "$_ENV"]}
  # 프로세스 밖에서 들어온 값. 명령 출력과 파일 내용은 이 프로그램이 만든 값이 아니다.
  - {pattern: name, name: [shell_exec, exec, system, passthru, popen, proc_open,
                           fgets, fread, file_get_contents, fgetss, stream_get_contents,
                           readline, getenv]}
sinks:
  - {pattern: call, callee: [include, include_once, require, require_once, readfile]}
sanitizers:
  # filter_var 는 넣지 않는다 — 두 번째 인자(FILTER_SANITIZE_EMAIL 등)에 따라
  # 주입 방어가 되기도 안 되기도 한다. 이름만 보는 지금 모델로는 구분할 수 없어
  # 정제로 인정하면 실제 취약점을 놓친다(실측: CWE_89 재현율 32.6%→54.3%).
  - {callee: [basename, realpath, intval, in_array]}
  # 경로 정규화 · 숫자 변환
  - {callee: [settype]}
