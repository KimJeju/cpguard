id: php.xss
message: "사용자 입력이 정제 없이 출력됩니다 (XSS)."
severity: high
cwe: CWE-79
owasp: "A03:2021-Injection"
languages: [php]
sources:
  - {pattern: name, name: ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_FILES", "$_SERVER", "$_SESSION", "$_ENV"]}
  # 프로세스 밖에서 들어온 값. 명령 출력과 파일 내용은 이 프로그램이 만든 값이 아니다.
  - {pattern: name, name: [shell_exec, exec, system, passthru, popen, proc_open,
                           fgets, fread, file_get_contents, fgetss, stream_get_contents,
                           readline, getenv]}
sinks:
  - {pattern: call, callee: [echo, print, printf, vprintf, print_r]}
sanitizers:
  - {callee: [htmlspecialchars, htmlentities, strip_tags, intval, urlencode, filter_var]}
  # 숫자 변환 계열
  - {callee: [settype, number_format, floatval]}
