id: php.xss
message: 사용자 입력이 정제 없이 출력됩니다 (XSS).
severity: high
cwe: CWE-79
owasp: A03:2021-Injection
languages:
- php
sources:
- pattern: name
  name:
  - $_GET
  - $_POST
  - $_REQUEST
  - $_COOKIE
  - $_FILES
  - $_SERVER
  - $_SESSION
  - $_ENV
- pattern: name
  name:
  - shell_exec
  - exec
  - system
  - passthru
  - popen
  - proc_open
  - fgets
  - fread
  - file_get_contents
  - fgetss
  - stream_get_contents
  - readline
  - getenv
- pattern: outparam
  arg: 1
  name:
  - exec
sinks:
- pattern: call
  callee:
  - echo
  - print
  - printf
  - vprintf
  - print_r
sanitizers:
- callee:
  - htmlspecialchars
  - htmlentities
  - strip_tags
  - intval
  - urlencode
  - settype
  - number_format
  - floatval
  - in_array
  - array_search
  - array_key_exists
  - preg_match
  - ctype_digit
  - ctype_alpha
  - ctype_alnum
- callee:
  - filter_var
  requires:
  - FILTER_VALIDATE_INT
  - FILTER_VALIDATE_FLOAT
  - FILTER_VALIDATE_BOOLEAN
  - FILTER_SANITIZE_NUMBER_INT
  - FILTER_SANITIZE_NUMBER_FLOAT
validators:
- token: in_array
- token: preg_match
- token: strcmp
- token: array_key_exists
