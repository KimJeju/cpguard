id: cpp.library-injection
message: 사용자 입력이 라이브러리 로드 경로로 흘러 들어갑니다 (라이브러리 주입).
severity: high
cwe: CWE-114
owasp: A08:2021-Software and Data Integrity Failures
languages:
- cpp
sources:
- pattern: name
  name:
  - argv
  - getenv
  - gets
  - fgets
  - scanf
  - fscanf
  - sscanf
  - read
  - recv
  - recvfrom
  - fread
  - getchar
  - cin
  - std::cin
  - getline
  - std::getline
  - readline
  - gets_s
  - GetCommandLine
  - GetCommandLineA
  - GetEnvironmentVariable
  - GetEnvironmentVariableA
  - ReadFile
  - recvmsg
  - WSARecv
  - getpass
  - getopt
- pattern: member
  object: argv
sinks:
- pattern: call
  callee:
  - dlopen
  - LoadLibrary
  - LoadLibraryA
  - LoadLibraryW
  - LoadLibraryEx
  - LoadLibraryExA
  - LoadLibraryExW
  - CoLoadLibrary
  - LoadPackagedLibrary
sanitizers:
- callee:
  - strtol
  - strtoul
  - strtoll
  - atoi
  - atol
  - realpath
  - PathCanonicalize
  - PathCanonicalizeA
  - canonicalize_file_name
  - std::stoi
  - stoi
  - std::stol
  - stol
  - mysql_real_escape_string
  - sqlite3_mprintf
  - PQescapeString
  - PQescapeLiteral
  - std::filesystem::canonical
  - canonical
  - basename
  - std::regex_match
  - regex_match
