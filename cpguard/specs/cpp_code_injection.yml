id: cpp.code-injection
message: 사용자 입력이 코드 실행 함수로 흘러 들어갑니다 (코드 주입).
severity: critical
cwe: CWE-94
owasp: A03:2021-Injection
languages:
- cpp
sources:
- pattern: name
  name:
  - argv
  - getenv
  - gets
  - fgets
  - scanf
  - fscanf
  - sscanf
  - read
  - recv
  - recvfrom
  - fread
  - getchar
  - cin
  - std::cin
  - getline
  - std::getline
  - readline
  - gets_s
  - GetCommandLine
  - GetCommandLineA
  - GetEnvironmentVariable
  - GetEnvironmentVariableA
  - ReadFile
  - recvmsg
  - WSARecv
  - getpass
  - getopt
- pattern: member
  object: argv
sinks:
- pattern: call
  callee:
  - PyRun_SimpleString
  - PyRun_String
  - luaL_dostring
  - luaL_loadstring
  - JS_EvaluateScript
  - duk_eval_string
  - duk_peval_string
  - mrb_load_string
  - rb_eval_string
  - Tcl_Eval
  - jl_eval_string
sanitizers:
- callee:
  - strtol
  - strtoul
  - strtoll
  - atoi
  - atol
  - realpath
  - PathCanonicalize
  - PathCanonicalizeA
  - canonicalize_file_name
  - std::stoi
  - stoi
  - std::stol
  - stol
  - mysql_real_escape_string
  - sqlite3_mprintf
  - PQescapeString
  - PQescapeLiteral
  - std::filesystem::canonical
  - canonical
  - basename
  - std::regex_match
  - regex_match
