id: py.code-injection
message: "사용자 입력이 코드 실행 함수로 흘러 들어갑니다 (코드 주입)."
severity: critical
cwe: CWE-94
owasp: "A03:2021-Injection"
languages: [python]
sources:
  - {pattern: name, name: ["request.GET", "request.POST", "request.args", "request.form", "request.json", "request.data", "request.values", "request.cookies", "request.headers", "sys.argv", "os.environ"]}
sinks:
  - {pattern: call, callee: [eval, exec, compile, pickle.loads, yaml.load, marshal.loads, dill.loads]}
sanitizers: []

validators:
  # 코드 주입은 값의 형태(따옴표로 감싸였는지 등)를 확인해 거부하는 방어가 흔하다.
  - {token: startswith}
  - {token: endswith}
  # 허용 목록·형식 검사로 거부하고 돌아가면 이어지는 코드에서는 검증된 값이다.
  # (실측: BenchProctor 안전 변형 오탐의 상당수가 이 형태였다)
  - {token: 'isdigit'}
  - {token: 'isalnum'}
