id: php.sqli
message: "사용자 입력이 SQL 질의문으로 흘러 들어갑니다 (SQL 주입)."
severity: critical
cwe: CWE-89
owasp: "A03:2021-Injection"
languages: [php]
sources:
  - {pattern: name, name: ["$_GET", "$_POST", "$_REQUEST", "$_COOKIE", "$_FILES", "$_SERVER", "$_SESSION", "$_ENV"]}
  # 프로세스 밖에서 들어온 값. 명령 출력과 파일 내용은 이 프로그램이 만든 값이 아니다.
  - {pattern: name, name: [shell_exec, exec, system, passthru, popen, proc_open,
                           fgets, fread, file_get_contents, fgetss, stream_get_contents,
                           readline, getenv]}
sinks:
  - {pattern: call, callee: [mysqli_query, mysql_query, pg_query, query, exec_query, mysqli_multi_query]}
sanitizers:
  # SQL 이스케이프의 구 API · 숫자 변환 계열
  # 화이트리스트·형식 검사 가드 — if(in_array($x,$허용)) 형태를 인정한다
  - {callee: [mysqli_real_escape_string, real_escape_string, intval, floatval, is_numeric, addslashes, prepare, bindParam, quote, mysql_real_escape_string, pg_escape_string, pg_escape_literal, sqlite_escape_string, settype, number_format, in_array, array_search, array_key_exists, preg_match, ctype_digit, ctype_alpha, ctype_alnum, htmlspecialchars, htmlentities, preg_replace]}
  # filter_var 는 두 번째 인자로 갈린다 — 숫자 필터만 주입을 막는다.
  - {callee: [filter_var], requires: [FILTER_VALIDATE_INT, FILTER_VALIDATE_FLOAT, FILTER_VALIDATE_BOOLEAN, FILTER_SANITIZE_NUMBER_INT, FILTER_SANITIZE_NUMBER_FLOAT]}
