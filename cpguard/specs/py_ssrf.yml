id: py.ssrf
message: "사용자 입력이 외부 요청 URL로 흘러 들어갑니다 (SSRF)."
severity: high
cwe: CWE-918
owasp: "A10:2021-Server-Side Request Forgery"
languages: [python]
sources:
  - {pattern: name, name: ["request.GET", "request.POST", "request.args", "request.form", "request.json", "request.data", "request.values", "request.cookies", "request.headers", "sys.argv", "os.environ"]}
sinks:
  - {pattern: call, callee: [requests.get, requests.post, requests.put, requests.delete, requests.request, urlopen, urllib.request.urlopen, httpx.get]}
sanitizers:
  - {callee: [urlparse, validate_url, is_allowed_url]}
validators:
  # 허용 목록·형식 검사로 거부하고 돌아가면 이어지는 코드에서는 검증된 값이다.
  # (실측: BenchProctor 안전 변형 오탐의 상당수가 이 형태였다)
  - {token: 'startswith'}
  - {token: 'endswith'}
  - {token: 'isdigit'}
  - {token: 'isalnum'}
